# set-option -sa terminal-overrides ",xterm*:Tc"
# set -g default-terminal "tmux-256color"

# Make Tmux-bar stay on top
set -g status-position top


# Set prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# General
set -g mouse on
set -g focus-events on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -s escape-time 10

set -g display-time 2000
 set -s focus-events on

# Make tmux split
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Add ctrl+hjkl movement
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Add alt+hjkl resizing
bind -n M-h resize-pane -L 5
bind -n M-j resize-pane -D 5
bind -n M-k resize-pane -U 5
bind -n M-l resize-pane -R 5

# Add tab movement
bind-key -n C-M-h previous-window
bind-key -n C-M-l next-window

# 2. Enable Vi mode (Actually add the keys this time)
set-window-option -g mode-keys vi
set -s set-clipboard on
# Pipe copy to xclip
set -s copy-command "xclip -selection clipboard -in"
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

setw -g aggressive-resize on

# --- PLUGINS (TPM) ---


if "test ! -d ~/.tmux/plugins/tpm" \
    "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark'
set -g @tmuc-gruvbox-right-status-x '%d.%m.%Y'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

